<section class="section">
  <div class="section-header">
    <h2 class="section-title">Self-Care & Bandwidth</h2>
  </div>
  <div class="bandwidth-grid">
    <div class="gauge-container">
      <div class="gauge">
        <div class="gauge-value">
          <div class="gauge-number" id="bandwidthScore">-</div>
          <div class="gauge-label">of 10</div>
        </div>
      </div>
      <div class="gauge-title">Current Bandwidth</div>
    </div>
    <div class="metrics-list">
      <div class="metric-row">
        <div class="metric-label">
          <div class="metric-icon">•</div>
          <span>Avg Sleep</span>
        </div>
        <div class="metric-value" id="avgSleepValue" style="color: var(--accent-teal);">- hrs</div>
      </div>
      <div class="metric-row">
        <div class="metric-label">
          <div class="metric-icon">•</div>
          <span>Exercise Days</span>
        </div>
        <div class="metric-value" id="exerciseDaysValue" style="color: var(--accent-sage);">- / 7</div>
      </div>
      <div class="metric-row">
        <div class="metric-label">
          <div class="metric-icon">•</div>
          <span>Social Time</span>
        </div>
        <div class="metric-value" style="color: var(--accent-gold);">- hrs</div>
      </div>
      <div class="metric-row">
        <div class="metric-label">
          <div class="metric-icon">•</div>
          <span>Morning Mandatories</span>
        </div>
        <div class="metric-value" style="color: var(--accent-coral);">- / 7</div>
      </div>
    </div>
  </div>
</section>
