<!-- Weekly Calendar Panel -->
<div class="weekly-calendar-panel">
  <div class="weekly-header">
    <h2>This Week</h2>
    <span id="weekRangeLabel" class="week-range"></span>
  </div>
  
  <div class="weekly-grid">
    <!-- Time column -->
    <div class="time-column">
      <div class="day-header-spacer"></div>
      <div class="time-labels" id="weeklyTimeLabels">
        <!-- Generated by JS: 5AM - 8PM -->
      </div>
    </div>
    
    <!-- Day columns -->
    <div class="day-column" data-day="monday">
      <div class="day-header">
        <span class="day-name">Mon</span>
        <span class="day-date" id="monday-date"></span>
      </div>
      <div class="day-timeline">
        <div class="day-events" id="monday-events"></div>
      </div>
    </div>
    
    <div class="day-column" data-day="tuesday">
      <div class="day-header">
        <span class="day-name">Tue</span>
        <span class="day-date" id="tuesday-date"></span>
      </div>
      <div class="day-timeline">
        <div class="day-events" id="tuesday-events"></div>
      </div>
    </div>
    
    <div class="day-column" data-day="wednesday">
      <div class="day-header">
        <span class="day-name">Wed</span>
        <span class="day-date" id="wednesday-date"></span>
      </div>
      <div class="day-timeline">
        <div class="day-events" id="wednesday-events"></div>
      </div>
    </div>
    
    <div class="day-column" data-day="thursday">
      <div class="day-header">
        <span class="day-name">Thu</span>
        <span class="day-date" id="thursday-date"></span>
      </div>
      <div class="day-timeline">
        <div class="day-events" id="thursday-events"></div>
      </div>
    </div>
    
    <div class="day-column" data-day="friday">
      <div class="day-header">
        <span class="day-name">Fri</span>
        <span class="day-date" id="friday-date"></span>
      </div>
      <div class="day-timeline">
        <div class="day-events" id="friday-events"></div>
      </div>
    </div>
    
    <div class="day-column" data-day="saturday">
      <div class="day-header">
        <span class="day-name">Sat</span>
        <span class="day-date" id="saturday-date"></span>
      </div>
      <div class="day-timeline">
        <div class="day-events" id="saturday-events"></div>
      </div>
    </div>
    
    <div class="day-column" data-day="sunday">
      <div class="day-header">
        <span class="day-name">Sun</span>
        <span class="day-date" id="sunday-date"></span>
      </div>
      <div class="day-timeline">
        <div class="day-events" id="sunday-events"></div>
      </div>
    </div>
  </div>
  
  <!-- Current time indicator (positioned absolutely, only shown on today) -->
  <div id="weeklyTimeIndicator" class="weekly-time-indicator" style="display: none;">
    <div class="indicator-dot"></div>
    <div class="indicator-line"></div>
  </div>
</div>
