name: Calendar Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Create data directory
        run: mkdir -p data
      
      - name: Fetch calendar data
        env:
          CALENDAR_ICS_URLS: ${{ secrets.CALENDAR_ICS_URLS }}
        run: python scripts/fetch_calendar_data.py
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/calendar_data.json
          git diff --staged --quiet || git commit -m "📅 Update calendar data"
          git push
