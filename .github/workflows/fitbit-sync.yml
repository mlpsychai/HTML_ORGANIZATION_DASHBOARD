name: Sync Fitbit Data

on:
  schedule:
    # 6 AM Arizona time (MST = UTC-7, no daylight saving)
    - cron: '0 13 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-fitbit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Fitbit data
        id: fitbit
        run: |
          # Get current date
          TODAY=$(TZ='America/Phoenix' date +%Y-%m-%d)
          
          # Exchange refresh token for new access token
          TOKEN_RESPONSE=$(curl -s -X POST https://api.fitbit.com/oauth2/token \
            -H "Authorization: Basic $(echo -n '${{ secrets.FITBIT_CLIENT_ID }}:${{ secrets.FITBIT_CLIENT_SECRET }}' | base64 -w 0)" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token&refresh_token=${{ secrets.FITBIT_REFRESH_TOKEN }}")
          
          # Extract tokens
          ACCESS_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.access_token')
          NEW_REFRESH_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.refresh_token')
          
          if [ "$ACCESS_TOKEN" == "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get access token"
            echo $TOKEN_RESPONSE
            exit 1
          fi
          
          # Save new refresh token for later step
          echo "new_refresh_token=$NEW_REFRESH_TOKEN" >> $GITHUB_OUTPUT
          
          # ============ FETCH ALL DATA (INCLUDING RAW/INTRADAY) ============
          
          # Sleep (includes stages, score, efficiency, levels timeline)
          SLEEP=$(curl -s -X GET "https://api.fitbit.com/1.2/user/-/sleep/date/${TODAY}.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Activity summary
          ACTIVITY=$(curl -s -X GET "https://api.fitbit.com/1/user/-/activities/date/${TODAY}.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Heart rate with intraday (1-minute resolution)
          HEART=$(curl -s -X GET "https://api.fitbit.com/1/user/-/activities/heart/date/${TODAY}/1d/1min.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # HRV with all intervals
          HRV=$(curl -s -X GET "https://api.fitbit.com/1/user/-/hrv/date/${TODAY}/all.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # SpO2 with intraday readings
          SPO2=$(curl -s -X GET "https://api.fitbit.com/1/user/-/spo2/date/${TODAY}/all.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Breathing rate
          BREATHING=$(curl -s -X GET "https://api.fitbit.com/1/user/-/br/date/${TODAY}.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Skin temperature
          SKIN_TEMP=$(curl -s -X GET "https://api.fitbit.com/1/user/-/temp/skin/date/${TODAY}.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Core temperature (if available)
          CORE_TEMP=$(curl -s -X GET "https://api.fitbit.com/1/user/-/temp/core/date/${TODAY}.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Cardio fitness score (VO2 max)
          CARDIO=$(curl -s -X GET "https://api.fitbit.com/1/user/-/cardioscore/date/${TODAY}.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Active Zone Minutes
          AZM=$(curl -s -X GET "https://api.fitbit.com/1/user/-/activities/active-zone-minutes/date/${TODAY}/1d.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Steps intraday (1-minute resolution)
          STEPS_INTRADAY=$(curl -s -X GET "https://api.fitbit.com/1/user/-/activities/steps/date/${TODAY}/1d/1min.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # ============ EXTRACT METRICS WITH ERROR HANDLING ============
          
          # Helper function for safe jq extraction
          safe_jq() {
            echo "$1" | jq "$2" 2>/dev/null || echo "$3"
          }
          
          safe_jq_raw() {
            echo "$1" | jq -r "$2" 2>/dev/null || echo "$3"
          }
          
          # Sleep metrics (summary)
          SLEEP_DURATION=$(safe_jq "$SLEEP" '.summary.totalMinutesAsleep // 0' '0')
          SLEEP_EFFICIENCY=$(safe_jq "$SLEEP" '.summary.efficiency // 0' '0')
          SLEEP_DEEP=$(safe_jq "$SLEEP" '.summary.stages.deep // 0' '0')
          SLEEP_LIGHT=$(safe_jq "$SLEEP" '.summary.stages.light // 0' '0')
          SLEEP_REM=$(safe_jq "$SLEEP" '.summary.stages.rem // 0' '0')
          SLEEP_WAKE=$(safe_jq "$SLEEP" '.summary.stages.wake // 0' '0')
          SLEEP_SCORE=$(safe_jq "$SLEEP" '.sleep[0].efficiency // 0' '0')
          SLEEP_START=$(safe_jq_raw "$SLEEP" '.sleep[0].startTime // ""' '')
          SLEEP_END=$(safe_jq_raw "$SLEEP" '.sleep[0].endTime // ""' '')
          
          # Sleep levels timeline (raw data for hypnogram)
          SLEEP_LEVELS=$(safe_jq "$SLEEP" '.sleep[0].levels.data // []' '[]')
          
          # Activity metrics (summary)
          STEPS=$(safe_jq "$ACTIVITY" '.summary.steps // 0' '0')
          DISTANCE=$(safe_jq "$ACTIVITY" '.summary.distances[0].distance // 0' '0')
          FLOORS=$(safe_jq "$ACTIVITY" '.summary.floors // 0' '0')
          ELEVATION=$(safe_jq "$ACTIVITY" '.summary.elevation // 0' '0')
          CALORIES_TOTAL=$(safe_jq "$ACTIVITY" '.summary.caloriesOut // 0' '0')
          CALORIES_BMR=$(safe_jq "$ACTIVITY" '.summary.caloriesBMR // 0' '0')
          CALORIES_ACTIVE=$(safe_jq "$ACTIVITY" '.summary.activityCalories // 0' '0')
          SEDENTARY_MIN=$(safe_jq "$ACTIVITY" '.summary.sedentaryMinutes // 0' '0')
          LIGHTLY_ACTIVE=$(safe_jq "$ACTIVITY" '.summary.lightlyActiveMinutes // 0' '0')
          FAIRLY_ACTIVE=$(safe_jq "$ACTIVITY" '.summary.fairlyActiveMinutes // 0' '0')
          VERY_ACTIVE=$(safe_jq "$ACTIVITY" '.summary.veryActiveMinutes // 0' '0')
          
          # Steps intraday (raw data)
          STEPS_RAW=$(safe_jq "$STEPS_INTRADAY" '.["activities-steps-intraday"].dataset // []' '[]')
          
          # Heart metrics (summary)
          RESTING_HR=$(safe_jq "$HEART" '.["activities-heart"][0].value.restingHeartRate // 0' '0')
          HR_ZONES=$(safe_jq "$HEART" '.["activities-heart"][0].value.heartRateZones // []' '[]')
          
          # Heart rate intraday (raw data - 1-minute resolution)
          HR_INTRADAY=$(safe_jq "$HEART" '.["activities-heart-intraday"].dataset // []' '[]')
          
          # HRV metrics (summary)
          HRV_DAILY=$(safe_jq "$HRV" '.hrv[0].value.dailyRmssd // 0' '0')
          HRV_DEEP=$(safe_jq "$HRV" '.hrv[0].value.deepRmssd // 0' '0')
          
          # HRV intraday (raw data - 5-minute intervals)
          HRV_INTRADAY=$(safe_jq "$HRV" '.hrv // []' '[]')
          
          # SpO2 (summary) - handle different response formats
          SPO2_AVG=$(safe_jq "$SPO2" '.value.avg // 0' '0')
          SPO2_MIN=$(safe_jq "$SPO2" '.value.min // 0' '0')
          SPO2_MAX=$(safe_jq "$SPO2" '.value.max // 0' '0')
          
          # SpO2 intraday (raw data)
          SPO2_INTRADAY=$(safe_jq "$SPO2" '. // []' '[]')
          
          # Breathing rate
          BREATHING_RATE=$(safe_jq "$BREATHING" '.br[0].value.breathingRate // 0' '0')
          
          # Skin temp
          SKIN_TEMP_VAL=$(safe_jq "$SKIN_TEMP" '.tempSkin[0].value.nightlyRelative // 0' '0')
          
          # Core temp
          CORE_TEMP_VAL=$(safe_jq "$CORE_TEMP" '.tempCore[0].value // 0' '0')
          
          # Cardio score (VO2 max)
          VO2_MAX=$(safe_jq "$CARDIO" '.cardioScore[0].value.vo2Max // 0' '0')
          
          # Active Zone Minutes
          AZM_TOTAL=$(safe_jq "$AZM" '.["activities-active-zone-minutes"][0].value.activeZoneMinutes // 0' '0')
          AZM_FAT_BURN=$(safe_jq "$AZM" '.["activities-active-zone-minutes"][0].value.fatBurnActiveZoneMinutes // 0' '0')
          AZM_CARDIO=$(safe_jq "$AZM" '.["activities-active-zone-minutes"][0].value.cardioActiveZoneMinutes // 0' '0')
          AZM_PEAK=$(safe_jq "$AZM" '.["activities-active-zone-minutes"][0].value.peakActiveZoneMinutes // 0' '0')
          
          # ============ CREATE JSON FILE ============
          mkdir -p data
          
          # Use jq to properly construct JSON with all arrays
          jq -n \
            --arg date "$TODAY" \
            --arg updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson sleep_duration "${SLEEP_DURATION:-0}" \
            --argjson sleep_efficiency "${SLEEP_EFFICIENCY:-0}" \
            --argjson sleep_score "${SLEEP_SCORE:-0}" \
            --arg sleep_start "$SLEEP_START" \
            --arg sleep_end "$SLEEP_END" \
            --argjson sleep_deep "${SLEEP_DEEP:-0}" \
            --argjson sleep_light "${SLEEP_LIGHT:-0}" \
            --argjson sleep_rem "${SLEEP_REM:-0}" \
            --argjson sleep_wake "${SLEEP_WAKE:-0}" \
            --argjson sleep_levels "${SLEEP_LEVELS:-[]}" \
            --argjson steps "${STEPS:-0}" \
            --argjson steps_intraday "${STEPS_RAW:-[]}" \
            --argjson distance "${DISTANCE:-0}" \
            --argjson floors "${FLOORS:-0}" \
            --argjson elevation "${ELEVATION:-0}" \
            --argjson cal_total "${CALORIES_TOTAL:-0}" \
            --argjson cal_bmr "${CALORIES_BMR:-0}" \
            --argjson cal_active "${CALORIES_ACTIVE:-0}" \
            --argjson min_sedentary "${SEDENTARY_MIN:-0}" \
            --argjson min_light "${LIGHTLY_ACTIVE:-0}" \
            --argjson min_fairly "${FAIRLY_ACTIVE:-0}" \
            --argjson min_very "${VERY_ACTIVE:-0}" \
            --argjson azm_total "${AZM_TOTAL:-0}" \
            --argjson azm_fat "${AZM_FAT_BURN:-0}" \
            --argjson azm_cardio "${AZM_CARDIO:-0}" \
            --argjson azm_peak "${AZM_PEAK:-0}" \
            --argjson resting_hr "${RESTING_HR:-0}" \
            --argjson hr_zones "${HR_ZONES:-[]}" \
            --argjson hr_intraday "${HR_INTRADAY:-[]}" \
            --argjson hrv_daily "${HRV_DAILY:-0}" \
            --argjson hrv_deep "${HRV_DEEP:-0}" \
            --argjson hrv_intraday "${HRV_INTRADAY:-[]}" \
            --argjson spo2_avg "${SPO2_AVG:-0}" \
            --argjson spo2_min "${SPO2_MIN:-0}" \
            --argjson spo2_max "${SPO2_MAX:-0}" \
            --argjson spo2_intraday "${SPO2_INTRADAY:-[]}" \
            --argjson breathing "${BREATHING_RATE:-0}" \
            --argjson skin_temp "${SKIN_TEMP_VAL:-0}" \
            --argjson core_temp "${CORE_TEMP_VAL:-0}" \
            --argjson vo2_max "${VO2_MAX:-0}" \
            '{
              date: $date,
              updated_at: $updated,
              sleep: {
                summary: {
                  duration_minutes: $sleep_duration,
                  efficiency: $sleep_efficiency,
                  score: $sleep_score,
                  start_time: $sleep_start,
                  end_time: $sleep_end,
                  stages: {
                    deep: $sleep_deep,
                    light: $sleep_light,
                    rem: $sleep_rem,
                    wake: $sleep_wake
                  }
                },
                levels: $sleep_levels
              },
              activity: {
                summary: {
                  steps: $steps,
                  distance_miles: $distance,
                  floors: $floors,
                  elevation: $elevation,
                  calories: {
                    total: $cal_total,
                    bmr: $cal_bmr,
                    active: $cal_active
                  },
                  minutes: {
                    sedentary: $min_sedentary,
                    lightly_active: $min_light,
                    fairly_active: $min_fairly,
                    very_active: $min_very
                  },
                  active_zone_minutes: {
                    total: $azm_total,
                    fat_burn: $azm_fat,
                    cardio: $azm_cardio,
                    peak: $azm_peak
                  }
                },
                intraday: {
                  steps: $steps_intraday
                }
              },
              heart: {
                summary: {
                  resting_hr: $resting_hr,
                  zones: $hr_zones
                },
                intraday: $hr_intraday
              },
              hrv: {
                summary: {
                  daily_rmssd: $hrv_daily,
                  deep_rmssd: $hrv_deep
                },
                intraday: $hrv_intraday
              },
              respiratory: {
                summary: {
                  spo2_avg: $spo2_avg,
                  spo2_min: $spo2_min,
                  spo2_max: $spo2_max,
                  breathing_rate: $breathing
                },
                intraday: {
                  spo2: $spo2_intraday
                }
              },
              temperature: {
                skin_variation: $skin_temp,
                core: $core_temp
              },
              cardio_fitness: {
                vo2_max: $vo2_max
              }
            }' > data/fitbit-latest.json
          
          echo "Data saved for $TODAY"
          echo "File size: $(wc -c < data/fitbit-latest.json) bytes"
          cat data/fitbit-latest.json

      - name: Update refresh token secret
        uses: hmanzur/actions-set-secret@v2.0.0
        with:
          name: 'FITBIT_REFRESH_TOKEN'
          value: ${{ steps.fitbit.outputs.new_refresh_token }}
          token: ${{ secrets.GH_PAT }}

      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/fitbit-latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Fitbit data $(date +%Y-%m-%d)" && git push)
