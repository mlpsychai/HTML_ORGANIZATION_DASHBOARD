name: Sync Fitbit Data

on:
  schedule:
    # 6 AM Arizona time (MST = UTC-7, no daylight saving)
    - cron: '0 13 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-fitbit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Fitbit data
        id: fitbit
        run: |
          # Get current date
          TODAY=$(TZ='America/Phoenix' date +%Y-%m-%d)
          
          # Exchange refresh token for new access token
          TOKEN_RESPONSE=$(curl -s -X POST https://api.fitbit.com/oauth2/token \
            -H "Authorization: Basic $(echo -n '${{ secrets.FITBIT_CLIENT_ID }}:${{ secrets.FITBIT_CLIENT_SECRET }}' | base64 -w 0)" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token&refresh_token=${{ secrets.FITBIT_REFRESH_TOKEN }}")
          
          # Extract tokens
          ACCESS_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.access_token')
          NEW_REFRESH_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.refresh_token')
          
          if [ "$ACCESS_TOKEN" == "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get access token"
            echo $TOKEN_RESPONSE
            exit 1
          fi
          
          # Save new refresh token for later step
          echo "new_refresh_token=$NEW_REFRESH_TOKEN" >> $GITHUB_OUTPUT
          
          # ============ FETCH ALL DATA (INCLUDING RAW/INTRADAY) ============
          
          # Sleep (includes stages, score, efficiency, levels timeline)
          SLEEP=$(curl -s -X GET "https://api.fitbit.com/1.2/user/-/sleep/date/${TODAY}.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Activity summary
          ACTIVITY=$(curl -s -X GET "https://api.fitbit.com/1/user/-/activities/date/${TODAY}.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Heart rate with intraday (1-minute resolution)
          HEART=$(curl -s -X GET "https://api.fitbit.com/1/user/-/activities/heart/date/${TODAY}/1d/1min.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # HRV with all intervals
          HRV=$(curl -s -X GET "https://api.fitbit.com/1/user/-/hrv/date/${TODAY}/all.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # SpO2 with intraday readings
          SPO2=$(curl -s -X GET "https://api.fitbit.com/1/user/-/spo2/date/${TODAY}/all.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Breathing rate
          BREATHING=$(curl -s -X GET "https://api.fitbit.com/1/user/-/br/date/${TODAY}.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Skin temperature
          SKIN_TEMP=$(curl -s -X GET "https://api.fitbit.com/1/user/-/temp/skin/date/${TODAY}.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Core temperature (if available)
          CORE_TEMP=$(curl -s -X GET "https://api.fitbit.com/1/user/-/temp/core/date/${TODAY}.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Cardio fitness score (VO2 max)
          CARDIO=$(curl -s -X GET "https://api.fitbit.com/1/user/-/cardioscore/date/${TODAY}.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Active Zone Minutes
          AZM=$(curl -s -X GET "https://api.fitbit.com/1/user/-/activities/active-zone-minutes/date/${TODAY}/1d.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # Steps intraday (1-minute resolution)
          STEPS_INTRADAY=$(curl -s -X GET "https://api.fitbit.com/1/user/-/activities/steps/date/${TODAY}/1d/1min.json" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          
          # ============ EXTRACT METRICS ============
          
          # Sleep metrics (summary)
          SLEEP_DURATION=$(echo $SLEEP | jq '.summary.totalMinutesAsleep // 0')
          SLEEP_EFFICIENCY=$(echo $SLEEP | jq '.summary.efficiency // 0')
          SLEEP_DEEP=$(echo $SLEEP | jq '.summary.stages.deep // 0')
          SLEEP_LIGHT=$(echo $SLEEP | jq '.summary.stages.light // 0')
          SLEEP_REM=$(echo $SLEEP | jq '.summary.stages.rem // 0')
          SLEEP_WAKE=$(echo $SLEEP | jq '.summary.stages.wake // 0')
          SLEEP_SCORE=$(echo $SLEEP | jq '.sleep[0].efficiency // 0')
          SLEEP_START=$(echo $SLEEP | jq -r '.sleep[0].startTime // ""')
          SLEEP_END=$(echo $SLEEP | jq -r '.sleep[0].endTime // ""')
          
          # Sleep levels timeline (raw data for hypnogram)
          SLEEP_LEVELS=$(echo $SLEEP | jq '.sleep[0].levels.data // []')
          
          # Activity metrics (summary)
          STEPS=$(echo $ACTIVITY | jq '.summary.steps // 0')
          DISTANCE=$(echo $ACTIVITY | jq '.summary.distances[0].distance // 0')
          FLOORS=$(echo $ACTIVITY | jq '.summary.floors // 0')
          ELEVATION=$(echo $ACTIVITY | jq '.summary.elevation // 0')
          CALORIES_TOTAL=$(echo $ACTIVITY | jq '.summary.caloriesOut // 0')
          CALORIES_BMR=$(echo $ACTIVITY | jq '.summary.caloriesBMR // 0')
          CALORIES_ACTIVE=$(echo $ACTIVITY | jq '.summary.activityCalories // 0')
          SEDENTARY_MIN=$(echo $ACTIVITY | jq '.summary.sedentaryMinutes // 0')
          LIGHTLY_ACTIVE=$(echo $ACTIVITY | jq '.summary.lightlyActiveMinutes // 0')
          FAIRLY_ACTIVE=$(echo $ACTIVITY | jq '.summary.fairlyActiveMinutes // 0')
          VERY_ACTIVE=$(echo $ACTIVITY | jq '.summary.veryActiveMinutes // 0')
          
          # Steps intraday (raw data)
          STEPS_RAW=$(echo $STEPS_INTRADAY | jq '.["activities-steps-intraday"].dataset // []')
          
          # Heart metrics (summary)
          RESTING_HR=$(echo $HEART | jq '.["activities-heart"][0].value.restingHeartRate // 0')
          HR_ZONES=$(echo $HEART | jq '.["activities-heart"][0].value.heartRateZones // []')
          
          # Heart rate intraday (raw data - 1-minute resolution)
          HR_INTRADAY=$(echo $HEART | jq '.["activities-heart-intraday"].dataset // []')
          
          # HRV metrics (summary)
          HRV_DAILY=$(echo $HRV | jq '.hrv[0].value.dailyRmssd // 0')
          HRV_DEEP=$(echo $HRV | jq '.hrv[0].value.deepRmssd // 0')
          
          # HRV intraday (raw data - 5-minute intervals)
          HRV_INTRADAY=$(echo $HRV | jq '.hrv // []')
          
          # SpO2 (summary)
          SPO2_AVG=$(echo $SPO2 | jq '.value.avg // 0' 2>/dev/null || echo "0")
          SPO2_MIN=$(echo $SPO2 | jq '.value.min // 0' 2>/dev/null || echo "0")
          SPO2_MAX=$(echo $SPO2 | jq '.value.max // 0' 2>/dev/null || echo "0")
          
          # SpO2 intraday (raw data)
          SPO2_INTRADAY=$(echo $SPO2 | jq '. // []')
          
          # Breathing rate
          BREATHING_RATE=$(echo $BREATHING | jq '.br[0].value.breathingRate // 0')
          
          # Skin temp
          SKIN_TEMP_VAL=$(echo $SKIN_TEMP | jq '.tempSkin[0].value.nightlyRelative // 0')
          
          # Core temp
          CORE_TEMP_VAL=$(echo $CORE_TEMP | jq '.tempCore[0].value // 0')
          
          # Cardio score (VO2 max)
          VO2_MAX=$(echo $CARDIO | jq '.cardioScore[0].value.vo2Max // 0')
          
          # Active Zone Minutes
          AZM_TOTAL=$(echo $AZM | jq '.["activities-active-zone-minutes"][0].value.activeZoneMinutes // 0')
          AZM_FAT_BURN=$(echo $AZM | jq '.["activities-active-zone-minutes"][0].value.fatBurnActiveZoneMinutes // 0')
          AZM_CARDIO=$(echo $AZM | jq '.["activities-active-zone-minutes"][0].value.cardioActiveZoneMinutes // 0')
          AZM_PEAK=$(echo $AZM | jq '.["activities-active-zone-minutes"][0].value.peakActiveZoneMinutes // 0')
          
          # ============ CREATE JSON FILE ============
          mkdir -p data
          
          # Use jq to properly construct JSON with all arrays
          jq -n \
            --arg date "$TODAY" \
            --arg updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson sleep_duration "$SLEEP_DURATION" \
            --argjson sleep_efficiency "$SLEEP_EFFICIENCY" \
            --argjson sleep_score "$SLEEP_SCORE" \
            --arg sleep_start "$SLEEP_START" \
            --arg sleep_end "$SLEEP_END" \
            --argjson sleep_deep "$SLEEP_DEEP" \
            --argjson sleep_light "$SLEEP_LIGHT" \
            --argjson sleep_rem "$SLEEP_REM" \
            --argjson sleep_wake "$SLEEP_WAKE" \
            --argjson sleep_levels "$SLEEP_LEVELS" \
            --argjson steps "$STEPS" \
            --argjson steps_intraday "$STEPS_RAW" \
            --argjson distance "$DISTANCE" \
            --argjson floors "$FLOORS" \
            --argjson elevation "$ELEVATION" \
            --argjson cal_total "$CALORIES_TOTAL" \
            --argjson cal_bmr "$CALORIES_BMR" \
            --argjson cal_active "$CALORIES_ACTIVE" \
            --argjson min_sedentary "$SEDENTARY_MIN" \
            --argjson min_light "$LIGHTLY_ACTIVE" \
            --argjson min_fairly "$FAIRLY_ACTIVE" \
            --argjson min_very "$VERY_ACTIVE" \
            --argjson azm_total "$AZM_TOTAL" \
            --argjson azm_fat "$AZM_FAT_BURN" \
            --argjson azm_cardio "$AZM_CARDIO" \
            --argjson azm_peak "$AZM_PEAK" \
            --argjson resting_hr "$RESTING_HR" \
            --argjson hr_zones "$HR_ZONES" \
            --argjson hr_intraday "$HR_INTRADAY" \
            --argjson hrv_daily "$HRV_DAILY" \
            --argjson hrv_deep "$HRV_DEEP" \
            --argjson hrv_intraday "$HRV_INTRADAY" \
            --argjson spo2_avg "$SPO2_AVG" \
            --argjson spo2_min "$SPO2_MIN" \
            --argjson spo2_max "$SPO2_MAX" \
            --argjson spo2_intraday "$SPO2_INTRADAY" \
            --argjson breathing "$BREATHING_RATE" \
            --argjson skin_temp "$SKIN_TEMP_VAL" \
            --argjson core_temp "$CORE_TEMP_VAL" \
            --argjson vo2_max "$VO2_MAX" \
            '{
              date: $date,
              updated_at: $updated,
              sleep: {
                summary: {
                  duration_minutes: $sleep_duration,
                  efficiency: $sleep_efficiency,
                  score: $sleep_score,
                  start_time: $sleep_start,
                  end_time: $sleep_end,
                  stages: {
                    deep: $sleep_deep,
                    light: $sleep_light,
                    rem: $sleep_rem,
                    wake: $sleep_wake
                  }
                },
                levels: $sleep_levels
              },
              activity: {
                summary: {
                  steps: $steps,
                  distance_miles: $distance,
                  floors: $floors,
                  elevation: $elevation,
                  calories: {
                    total: $cal_total,
                    bmr: $cal_bmr,
                    active: $cal_active
                  },
                  minutes: {
                    sedentary: $min_sedentary,
                    lightly_active: $min_light,
                    fairly_active: $min_fairly,
                    very_active: $min_very
                  },
                  active_zone_minutes: {
                    total: $azm_total,
                    fat_burn: $azm_fat,
                    cardio: $azm_cardio,
                    peak: $azm_peak
                  }
                },
                intraday: {
                  steps: $steps_intraday
                }
              },
              heart: {
                summary: {
                  resting_hr: $resting_hr,
                  zones: $hr_zones
                },
                intraday: $hr_intraday
              },
              hrv: {
                summary: {
                  daily_rmssd: $hrv_daily,
                  deep_rmssd: $hrv_deep
                },
                intraday: $hrv_intraday
              },
              respiratory: {
                summary: {
                  spo2_avg: $spo2_avg,
                  spo2_min: $spo2_min,
                  spo2_max: $spo2_max,
                  breathing_rate: $breathing
                },
                intraday: {
                  spo2: $spo2_intraday
                }
              },
              temperature: {
                skin_variation: $skin_temp,
                core: $core_temp
              },
              cardio_fitness: {
                vo2_max: $vo2_max
              }
            }' > data/fitbit-latest.json
          
          echo "Data saved for $TODAY"
          echo "File size: $(wc -c < data/fitbit-latest.json) bytes"
          cat data/fitbit-latest.json

      - name: Update refresh token secret
        uses: hmanzur/actions-set-secret@v2.0.0
        with:
          name: 'FITBIT_REFRESH_TOKEN'
          value: ${{ steps.fitbit.outputs.new_refresh_token }}
          token: ${{ secrets.GH_PAT }}

      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/fitbit-latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Fitbit data $(date +%Y-%m-%d)" && git push)
